[package]
name = "drivestream"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mount Google Drive on macOS as a folder that streams files on demand"
license = "MIT"
readme = "README.md"
keywords = ["google-drive", "nfs", "macos", "streaming", "filesystem"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
md-5 = "0.10"
nfsserve = "0.11"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
debug = 1
